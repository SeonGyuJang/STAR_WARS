{% macro spark(cls='spark') %}<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 7.6 16.4 11.1 24 12C16.4 12.9 12.9 16.4 12 24C11.1 16.4 7.6 12.9 0 12C7.6 11.1 11.1 7.6 12 0Z"/></svg>{% endmacro %}
{% macro meter(score, cls='') %}{% set score = score or 0 %}<span class="meter {{ cls }}">{% for i in range(10) %}{% set f = [[score - i, 0] | max, 1] | min %}<i style="--f: {{ (f * 100) | round | int }}%"></i>{% endfor %}</span>{% endmacro %}
{% macro csrf() %}<input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% endmacro %}
