{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}관리자 로그인 · {{ site_name }}{% endblock %}
{% block content %}
<section class="card login">
  <h1>관리자 로그인</h1>
  <p class="small muted">대시보드는 누구나 볼 수 있습니다. 키워드와 저널 변경, 실행은 관리자만 할 수 있어요.</p>
  <form method="post" class="row-form">{{ csrf() }}
    <input type="password" name="password" placeholder="비밀번호" autofocus required>
    <button class="btn">로그인</button>
  </form>
</section>
{% endblock %}
